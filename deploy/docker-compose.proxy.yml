# Meedraaien op het netwerk van een proxy die er al staat.
#
# Gebruik dit als er al een Caddy, Traefik of nginx in Docker draait voor andere
# sites. De webcontainer komt dan op het netwerk van die proxy te staan, zodat
# die hem op naam kan bereiken, en er hoeft geen poort meer op de host open.
#
#   PROXY_NETWORK=routd-app_routd-network   # in deploy/.env
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.proxy.yml \
#     --env-file deploy/.env up -d
#
# Waarom dit een apart bestand is en geen `docker network connect`: die
# verbinding leg je met de hand en hij verdwijnt zodra de proxycontainer opnieuw
# wordt aangemaakt. Zo staat het in de compose en overleeft het elke herstart.
#
# De naam van het netwerk is die van Docker, dus met het projectvoorvoegsel
# erbij. Opzoeken met: docker network ls

services:
  web:
    networks:
      - default
      - proxy
    # De proxy praat over het netwerk, dus de host hoeft geen poort te openen.
    # Wil je hem toch bereikbaar houden op localhost (om te testen), haal deze
    # regel dan weg en houd BIND_ADDRESS op 127.0.0.1.
    ports: !reset []

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?zet PROXY_NETWORK in deploy/.env, bijvoorbeeld routd-app_routd-network}
